name: Python Studio Package Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-allowed: true
    runs-on: ubuntu-latest

    steps:
    - name: Check out active repository files layer
      uses: actions/checkout@v4

    - name: Set up core Python execution environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Provision workspace dependencies matrix
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run compilation lint syntax test pass
      run: |
        # This checks that your module cogs can compile smoothly without raw syntax syntax errors
        python -m py_compile main.py core.py
